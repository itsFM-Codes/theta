# This is the configuration file for Theta Chess Engine.
# You can adjust the settings below to customize the engine's behavior.
# Remove a (#) at the beginning of a line to enable a setting, or add one to disable it.

[options]
# Multi-threaded search is not implemented yet. Theta currently uses one
# search worker; a UCI Threads option will be added with Lazy SMP.
max_depth = 20
# threads = 4

[developer]
# When false, Theta strongly avoids choosing repetition, fifty-move,
# insufficient-material, and stalemate lines when an alternative exists.
allow_draw = true

# Texel output can be pasted here after tuning.
eval_material_scale = 224
eval_piece_square_scale = 241
eval_mobility_scale = 233
eval_pawn_structure_scale = 229
eval_king_safety_scale = 251
eval_piece_activity_scale = 249
eval_threat_scale = 257
eval_space_scale = 253
eval_tempo_bonus = 13

# Search parameters exposed for match-based tuning.
search_lmr_depth_start = 3
search_lmr_move_start = 3
search_null_move_base = 4
search_static_futility_margin = 105
